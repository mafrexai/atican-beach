name: Property sync cron

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '5-59/10 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Sync bookings
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/property-sync-bookings" -H "Authorization: Bearer $CRON_SECRET"
      - name: Sync checkins
        if: github.event.schedule == '5-59/10 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/property-sync-checkins" -H "Authorization: Bearer $CRON_SECRET"
      - name: Reconcile pending payments
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/reconcile-pending-payments" -H "Authorization: Bearer $CRON_SECRET"
      - name: Notify staff of new bookings
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/notify-staff-new-bookings" -H "Authorization: Bearer $CRON_SECRET"
