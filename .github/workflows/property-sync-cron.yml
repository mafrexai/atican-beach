name: Property sync cron

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '5-59/10 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Sync bookings
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/property-sync-bookings" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Sync checkins
        if: github.event.schedule == '5-59/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: curl -sf -X GET "https://www.aticanbeachresort.com/api/cron/property-sync-checkins" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
